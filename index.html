<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stride • Your study space</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20fill%3D%22%237654d9%22%20d%3D%22M32%203C35%2022%2042%2029%2061%2032C42%2035%2035%2042%2032%2061C29%2042%2022%2035%203%2032C22%2029%2029%2022%2032%203Z%22%2F%3E%3C%2Fsvg%3E"><link rel="stylesheet" href="style.css"></head><body>
<aside><a class="brand" href="#dashboard">✦ Stride</a><p class="muted">Small steps. Big possibilities.</p><nav id="nav"></nav><div class="aside-foot">Your own pace.<br>Your next chapter.</div></aside>
<main><header><div><span class="eyebrow">YOUR PERSONAL STUDY SPACE</span><h1 id="title">Dashboard</h1></div><button id="log">＋ Log study</button></header><div id="content"></div><footer><span id="storage">Saved on this browser</span><button class="quiet" id="export">Export backup</button><label class="quiet file">Import backup<input type="file" id="import" accept=".json,application/json" hidden></label></footer></main>
<dialog id="dialog"><form id="session"><h2>A little effort, a little closer ✨</h2><label>Subject or course<select name="target" required></select></label><label>Activity<select name="activity"><option>Flashcards</option><option>Past papers</option><option>Note taking</option><option>Homework</option></select></label><label>Topic<input name="topic" required maxlength="120" placeholder="What did you work on?"></label><div class="grid two"><label>Minutes<input name="minutes" type="number" min="1" max="1440" required></label><label>Date<input name="date" type="date" required></label></div><label>Notes<textarea name="notes" maxlength="2000" placeholder="What clicked? What needs another look?"></textarea></label><div class="actions"><button type="button" class="quiet" id="cancel">Cancel</button><button>Save session</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
